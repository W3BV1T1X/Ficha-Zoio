<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo">
        <div class="conteiner-topo">
            <div class="campo-topo"><p>Nome personagem</p><input type="text"></div>
            <div class="campo-topo"><p>Nome jogador</p><input type="text"></div>
            <div class="campo-topo"><p>Pontos de experiência</p><input type="text"></div>
            <div class="campo-topo"><p>Raça</p><input type="text"></div>
            <div class="campo-topo"><p>Classe</p><input type="text"></div>
            <div class="campo-topo"><p>Alinhamento</p><input type="text"></div>
        </div>
    </header>

    <main class="conteudo-principal">
        <section class="grade-meio">
            
            <div class="atributos-verticais">
                <div class="bloco-atributo"><p>FOR</p><input type="text"></div>
                <div class="bloco-atributo"><p>DES</p><input type="text"></div>
                <div class="bloco-atributo"><p>CON</p><input type="text"></div>
                <div class="bloco-atributo"><p>INT</p><input type="text"></div>
                <div class="bloco-atributo"><p>SAB</p><input type="text"></div>
                <div class="bloco-atributo"><p>CAR</p><input type="text"></div>
            </div>

            <div class="centro-ficha">
                <div class="status-topo">
                    <div class="bloco-status"><p>Vida</p><input type="text"></div>
                    <div class="bloco-status"><p>Defesa</p><input type="text"></div>
                    <div class="bloco-status"><p>Velocidade</p><input type="text"></div>
                </div>
                <div class="imagem-personagem">
                    <img src="zoio.png" alt="Avatar do Personagem">
                </div>
            </div>

            <div class="secao-biografia">
                <h2>Biografia</h2>
                <textarea rows="15"></textarea>
            </div>
        </section>

        <section class="blocos-inferiores">
            <div class="bloco-texto-baixo">
                <h2>Equipamentos</h2>
                <textarea rows="8"></textarea>
            </div>
            <div class="bloco-texto-baixo">
                <h2>Características</h2>
                <textarea rows="8"></textarea>
            </div>
        </section>
    </main>

</body>
</html>
